name: Accesibilidad e Inclusión
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  a11y-audit:
    name: Auditoría WCAG 2.2 AA (axe-core + Lighthouse)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aerocontrol_ops
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=3s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: aerocontrol_ops
      PORT: 4173

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-package-lock
          npm install --no-save playwright @axe-core/playwright wait-on
          npx playwright install --with-deps chromium

      - name: Ejecutar pruebas unitarias, seguridad (Punto 6) y radar
        run: |
          npm test
          npm run test:radar

      - name: Inicializar base de datos MySQL
        run: |
          mysql -h 127.0.0.1 -u root -proot aerocontrol_ops < database/aerocontrol_mysql.sql

      - name: Iniciar servidor backend AeroControl
        run: |
          node server-mysql.mjs &
          npx wait-on http://127.0.0.1:4173 --timeout 20000

      - name: Ejecutar auditoría automatizada de accesibilidad (axe-core)
        run: |
          node tests/accessibility.mjs

      - name: Ejecutar auditoría Lighthouse (Accesibilidad)
        run: |
          npx lighthouse http://127.0.0.1:4173 --only-categories=accessibility --output=html --output=json --output-path=tests/artifacts/lighthouse-a11y --chrome-flags="--headless"

      - name: Publicar evidencias y reportes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-accesibilidad-aerocontrol
          path: tests/artifacts/

